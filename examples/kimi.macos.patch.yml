# Replace BOTH absolute placeholders and verify official KimiCU.app is installed.
- insert:
    - id: computer-use-registry
      name: '@deepseek-ai/dsh-computer-use'
    - id: kimi-cu-provider
      name: '/ABSOLUTE/PATH/dsh-computer-use/plugin/dist/index.js'
      config:
        backend: kimi
        command: '/Applications/KimiCU.app/Contents/MacOS/kimi-cu'
        args: [mcp]
        allowCapture: false
        allowInput: false
        toolCallTimeoutMs: 20000
    - id: kimi-cu-agent-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: 'dsh-computer-use-kimi'
        includeDefaultRoots: false
        customSkillDirs: ['/ABSOLUTE/PATH/dsh-computer-use/skills']
