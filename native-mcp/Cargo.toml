[package]
name = "dsh-native-cua"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone native Computer Use MCP server for DeepSeek Harness"

[dependencies]
anyhow = "1"
base64 = "0.22"
enigo = "0.6.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25.1", features = ["input"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
